# Nginx 配置：前端静态站点 + API 反代到 frp 穿透地址

server {
    listen 80;
    server_name JSVOC.jadejinyuxuan.com;

    # 强制跳转 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name JSVOC.jadejinyuxuan.com;

    # SSL 证书路径（后面用 certbot 自动申请）
    ssl_certificate /etc/letsencrypt/live/JSVOC.jadejinyuxuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/JSVOC.jadejinyuxuan.com/privkey.pem;

    # 前端 Next.js 静态导出
    root /opt/JSVOC/current/frontend-v2/dist;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API 反代到 frp 穿透地址（你的本地后端）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持流式响应（SSE）
        proxy_buffering off;
        proxy_cache off;

        # 长超时（AI 生成可能较慢）
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # WebSocket 支持（如果后续需要）
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
