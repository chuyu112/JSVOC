services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: jsvoc_postgres
    restart: always
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-short_video_ops}
    volumes:
      - jsvoc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d short_video_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: jsvoc_postgres_backup
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-short_video_ops}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR: /backups
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p "$$BACKUP_DIR"
        while true; do
          timestamp=$$(date +%Y%m%d_%H%M%S)
          file="$$BACKUP_DIR/$${POSTGRES_DB}_$${timestamp}.dump"
          echo "creating PostgreSQL backup $$file"
          pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$file"
          find "$$BACKUP_DIR" -type f -name "$${POSTGRES_DB}_*.dump" -mtime +"$${POSTGRES_BACKUP_RETENTION_DAYS:-14}" -delete
          sleep "$${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}"
        done

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: jsvoc_backend
    restart: always
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-short_video_ops}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend-v2:
    build:
      context: ./frontend-v2
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
    container_name: jsvoc_frontend
    restart: always
    mem_limit: 256m
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  jsvoc_postgres_data:
    name: jsvoc_postgres_data
